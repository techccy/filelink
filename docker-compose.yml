services:
  filelink:
    build: .
    restart: unless-stopped
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?set UPLOAD_TOKEN in .env}
      BASE_URL: ${BASE_URL:-}
      DATA_DIR: /data
      MAX_SIZE_MB: ${MAX_SIZE_MB:-100}
      UPLOAD_TTL: ${UPLOAD_TTL:-2h}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
    volumes:
      - ./data:/data
    ports:
      # 默认只绑回环，供同机的反向代理 / 隧道转发。
      # 要直接对外暴露，改为 "0.0.0.0:8080"（自行负责防火墙与 HTTPS）。
      - "${FILELINK_BIND:-127.0.0.1:8080}:8080"

[package]
name = "filelink-desktop"
version = "0.1.0"
description = "filelink 桌面客户端：菜单栏常驻，拖入文件即得临时公链"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-menubar-dnd = "0.3"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
time = { version = "0.3", default-features = false, features = ["parsing"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rfd = "0.15"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
